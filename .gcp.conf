gcp_project=veltzer-randomizer-id

# Where and how the app is deployed by gcloud_deploy.sh (utils-bash).
gcp_service=randomizer
gcp_region=us-central1
# Custom domain: a Cloud Run domain mapping (gcloud_run_domain.sh), backed by
# the Cloudflare record `randomizer CNAME ghs.googlehosted.com`, which must
# stay DNS only (not proxied) or Google cannot issue or renew the certificate.
# It is the canonical address: the app redirects the run.app hostnames to it
# (CANONICAL_HOST below).
gcp_domain=randomizer.veltzer.org
gcp_run_args=(
	--allow-unauthenticated
	--max-instances 2
	--update-env-vars "CANONICAL_HOST=${gcp_domain}"
)
