<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<!-- a die, tilted as if just thrown -->
	<g transform="rotate(-10 32 32)">
		<rect x="8" y="8" width="48" height="48" rx="10" fill="#4caf50"/>
		<rect x="8" y="8" width="48" height="48" rx="10" fill="none" stroke="#2e7d32" stroke-width="3"/>
		<!-- five pips -->
		<g fill="#ffffff">
			<circle cx="20" cy="20" r="5"/>
			<circle cx="44" cy="20" r="5"/>
			<circle cx="32" cy="32" r="5"/>
			<circle cx="20" cy="44" r="5"/>
			<circle cx="44" cy="44" r="5"/>
		</g>
	</g>
</svg>
