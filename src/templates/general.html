<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Practice Randomizer</title>
		<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
		<link rel="stylesheet" href="/static/style.css">
	</head>
	<body>
		<header class="topbar">
			<a class="brand" href="/">
				<img class="brand-mark" src="/static/favicon.svg" alt="">
				Randomizer
			</a>
			<nav class="nav">
				<a href="/modes">Modes</a>
				<a href="/general" aria-current="page">Your list</a>
			</nav>
		</header>
		<main>
			<h1>Practice Randomizer</h1>
			<form method="POST">
				<label for="items">Enter your list items (one per line):</label>
				<textarea name="items" id="items" required></textarea>
				<button class="button" type="submit">Randomize</button>
			</form>
			{% if randomized_list %}
			<h2>Randomized List:</h2>
			<ul class="shuffled">
				{% for item in randomized_list %}
				<li>{{ item }}</li>
				{% endfor %}
			</ul>
			{% endif %}
		</main>
		<footer>
			build {{ build.git_describe }}, deployed {{ build.deploy_date }}, revision {{ build.revision }}
		</footer>
	</body>
</html>
